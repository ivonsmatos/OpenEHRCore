# Cloudflare Workers (Static Assets) — publica o site institucional (landing/).
# IMPORTANTE: "name" deve casar com o Worker que tem o domínio actahub.com.br.
# O build da dashboard roda `npx wrangler deploy` a partir da raiz (Caminho "/"),
# então este arquivo PRECISA estar na main.
# Para publicar o frontend PWA, troque "directory" para "./frontend-pwa/dist"
# e adicione o build command (ver README do landing).
name = "interophealth"
compatibility_date = "2025-06-01"

[assets]
directory = "./landing"
# Site multipágina com 404.html dedicado:
not_found_handling = "404-page"
