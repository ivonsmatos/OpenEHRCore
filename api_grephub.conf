# API Backend - api.grephub.com.br
server {
    listen 80;
    server_name api.grephub.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.grephub.com.br;

    ssl_certificate /etc/letsencrypt/live/api.grephub.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.grephub.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /opt/openehrcore/backend-django/staticfiles/;
    }

    location /media/ {
        alias /opt/openehrcore/backend-django/media/;
    }
}
