# Stack de produção/demo isolado (projeto compose `openehrcore`).
# Portas publicadas só em 127.0.0.1 — exposição pública apenas via Cloudflare Tunnel
# (app -> frontend:8012, bff -> django:8011). HAPI/Keycloak/Postgres ficam internos.
# Segredos vêm de docker/.env (NÃO versionar o .env).
#   docker compose -f docker-compose.prod.yml --env-file .env -p openehrcore up -d --build
services:
  postgres:
    image: postgres:16-alpine
    container_name: openehr_postgres
    environment:
      POSTGRES_DB: hapi_fhir
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: keycloak,openehr
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d hapi_fhir"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [openehr_network]
    restart: unless-stopped

  hapi-fhir:
    image: hapiproject/hapi:v7.2.0
    container_name: openehr_hapi_fhir
    environment:
      spring.datasource.url: jdbc:postgresql://postgres:5432/hapi_fhir
      spring.datasource.username: ${POSTGRES_USER}
      spring.datasource.password: ${POSTGRES_PASSWORD}
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      spring.jpa.hibernate.ddl-auto: update
      hapi.fhir.fhir_version: R4
    depends_on:
      postgres:
        condition: service_healthy
    networks: [openehr_network]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: openehr_keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY: edge
      KC_HTTP_ENABLED: "true"
    command: start-dev
    ports:
      - "127.0.0.1:8181:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [openehr_network]
    restart: unless-stopped

  django:
    build:
      context: ../backend-django
      dockerfile: Dockerfile
    container_name: openehr_django
    environment:
      DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: bff.actahub.com.br,localhost,127.0.0.1,django
      CSRF_TRUSTED_ORIGINS: https://bff.actahub.com.br,https://app.actahub.com.br
      CORS_ALLOWED_ORIGINS: https://app.actahub.com.br
      SECURE_SSL_REDIRECT: "False"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openehr
      FHIR_SERVER_URL: http://hapi-fhir:8080/fhir
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: openehrcore
      KEYCLOAK_CLIENT_ID: openehrcore
      # IA (Gemini) — segredos vêm do docker/.env, NÃO assados na imagem.
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY}
    ports:
      - "127.0.0.1:8011:8000"
    depends_on:
      postgres:
        condition: service_healthy
      hapi-fhir:
        condition: service_started
      keycloak:
        condition: service_started
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn openehrcore.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    networks: [openehr_network]
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend-pwa
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://bff.actahub.com.br/api/v1
    container_name: openehr_frontend
    ports:
      - "127.0.0.1:8012:80"
    networks: [openehr_network]
    restart: unless-stopped

  fhir-seeder:
    build:
      context: ../backend-django
      dockerfile: Dockerfile
    container_name: openehr_fhir_seeder
    environment:
      FHIR_SERVER_URL: http://hapi-fhir:8080/fhir
    depends_on:
      hapi-fhir:
        condition: service_started
    command: sh -c "sleep 40 && python scripts/seed_fhir_data.py && echo SEED_DONE"
    networks: [openehr_network]
    restart: "no"

volumes:
  postgres_data:
    driver: local

networks:
  openehr_network:
    driver: bridge
